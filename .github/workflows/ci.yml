name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  docker:
    # Real MySQL: builds the image and brings the stack up through docker-compose.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create backend/.env from the example
        run: |
          cp backend/.env.example backend/.env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=ci-password/; s/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=ci-secret-key/" backend/.env
      - name: Start the stack
        run: docker compose --env-file backend/.env up -d --build --wait --wait-timeout 180
      - name: Smoke test (docs, register, login, protected route)
        run: |
          curl -fsS -o /dev/null http://localhost:3000/doc/
          curl -fsS -X POST http://localhost:3000/users -H 'Content-Type: application/json' \
            -d '{"firstName":"Ci","lastName":"User","cpf":"1","email":"ci@example.com","password":"pw-12345","phoneNumber":"1"}'
          TOKEN=$(curl -fsS -X POST http://localhost:3000/userLogin -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"pw-12345"}' | jq -r .jwtToken)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/users)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/users -H "Authorization: $TOKEN")" = "200"
      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file backend/.env logs
